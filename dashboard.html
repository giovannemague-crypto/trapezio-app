<html lang="pt-BR">

<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Trapézio — Dashboard Supervisor</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1520;color:#e0e8f0;min-height:100vh}
.topbar{background:#111927;border-bottom:1px solid #1e2d42;padding:0 24px;display:flex;justify-content:space-between;align-items:center;height:60px}
.logo{display:flex;align-items:center;gap:10px}
.logo-texts{display:flex;flex-direction:column}
.logo-postos{font-size:9px;color:#4a6a8a;letter-spacing:0.18em;text-transform:uppercase}
.logo-name{font-size:17px;font-weight:800;color:#fff;letter-spacing:0.06em;text-transform:uppercase;font-style:italic}
.topbar-right{display:flex;align-items:center;gap:10px}
.pill{font-size:11px;padding:3px 10px;border-radius:20px}
.pill-live{background:rgba(46,209,100,0.15);color:#4dd87a;border:1px solid rgba(46,209,100,0.3)}
.pill-date{background:rgba(255,255,255,0.06);color:#8aaac0;border:1px solid rgba(255,255,255,0.1)}
.btn-top{font-size:12px;padding:6px 14px;border-radius:6px;border:1px solid #2a4060;background:transparent;color:#8aaac0;cursor:pointer}
.btn-top:hover{background:#1a2a3a;color:#fff}
.content{padding:20px 24px}
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{border-radius:12px;padding:18px 20px;position:relative;overflow:hidden}
.kpi-0{background:linear-gradient(135deg,#1a3a6b,#2e7dd1)}
.kpi-1{background:linear-gradient(135deg,#0f6e56,#1D9E75)}
.kpi-2{background:linear-gradient(135deg,#633806,#EF9F27)}
.kpi-3{background:linear-gradient(135deg,#791F1F,#E24B4A)}
.kpi-label{font-size:11px;color:rgba(255,255,255,0.7);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:8px}
.kpi-val{font-size:32px;font-weight:700;color:#fff;line-height:1}
.kpi-sub{font-size:12px;color:rgba(255,255,255,0.6);margin-top:6px}
.estado-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.estado-card{background:#131e2e;border:1px solid #1e2d42;border-radius:12px;padding:14px 16px}
.estado-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.estado-nome{font-size:20px;font-weight:700;color:#fff}
.prog-wrap{height:6px;background:#1e2d42;border-radius:3px;overflow:hidden;margin-bottom:6px}
.prog-bar{height:100%;border-radius:3px;transition:width 0.8s}
.estado-frac{font-size:11px;color:#4a6a8a}
.sec-label{font-size:11px;font-weight:600;color:#4a6a8a;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-label::after{content:"";flex:1;height:1px;background:#1e2d42}
.tabs{display:flex;background:#131e2e;border:1px solid #1e2d42;border-radius:10px;padding:4px;gap:4px;margin-bottom:14px}
.tab{flex:1;padding:8px;font-size:12px;border:none;border-radius:7px;background:transparent;color:#4a6a8a;cursor:pointer;font-weight:500;transition:all 0.15s}
.tab.on{background:#1a3a6b;color:#fff}
.toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.input-s{flex:1;min-width:160px;padding:8px 14px;font-size:13px;border-radius:8px;border:1px solid #1e2d42;background:#131e2e;color:#e0e8f0;outline:none}
.input-s:focus{border-color:#2e7dd1}
.input-s::placeholder{color:#3a5a7a}
.btn-est{padding:6px 14px;font-size:12px;border-radius:8px;border:1px solid #1e2d42;background:#131e2e;color:#6a8aaa;cursor:pointer}
.btn-est.on{background:#2e7dd1;color:#fff;border-color:#2e7dd1}
.posto-row{background:#131e2e;border:1px solid #1e2d42;border-radius:10px;padding:12px 16px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;transition:all 0.12s}
.posto-row:hover{border-color:#2e7dd1;background:#172030}
.posto-row.alerta{border-left:3px solid #E24B4A}
.row-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dot-g{background:#4dd87a;box-shadow:0 0 6px rgba(77,216,122,0.5)}
.dot-r{background:#e24b4a;box-shadow:0 0 6px rgba(226,75,74,0.5)}
.row-nome{font-size:13px;font-weight:500;color:#e0e8f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:11px;color:#4a6a8a;margin-top:2px}
.row-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:5px;white-space:nowrap;border:1px solid;font-weight:600}
.b-ipa{background:rgba(250,174,50,0.12);color:#faa932;border-color:rgba(250,174,50,0.3)}
.b-she{background:rgba(226,75,74,0.12);color:#e24b4a;border-color:rgba(226,75,74,0.3)}
.b-br{background:rgba(46,125,209,0.12);color:#5aaeff;border-color:rgba(46,125,209,0.3)}
.b-tra{background:rgba(100,100,220,0.12);color:#9090ff;border-color:rgba(100,100,220,0.3)}
.b-rdp{background:rgba(29,158,117,0.12);color:#2ec496;border-color:rgba(29,158,117,0.3)}
.b-oth{background:rgba(255,255,255,0.06);color:#8aaac0;border-color:rgba(255,255,255,0.1)}
.b-red{background:rgba(226,75,74,0.15);color:#e24b4a;border-color:rgba(226,75,74,0.3)}
.b-amb{background:rgba(186,117,23,0.15);color:#f0a030;border-color:rgba(186,117,23,0.3)}
.b-grn{background:rgba(77,216,122,0.12);color:#4dd87a;border-color:rgba(77,216,122,0.3)}
.chevron{font-size:16px;color:#3a5a7a}
.alerta-row{background:#1a0a0a;border:1px solid #3a1515;border-left:3px solid #e24b4a;border-radius:10px;padding:12px 16px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.pend-row{background:#1a1500;border:1px solid #3a2a00;border-left:3px solid #f0a030;border-radius:10px;padding:12px 16px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.empty{text-align:center;padding:3rem;color:#3a5a7a;font-size:14px}
.det-header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.btn-back{background:transparent;border:none;font-size:22px;cursor:pointer;color:#4a6a8a;padding:0}
.comp-card{background:#131e2e;border:1px solid #1e2d42;border-radius:12px;padding:16px;margin-bottom:12px}
.comp-table{width:100%;border-collapse:collapse;font-size:13px}
.comp-table th{text-align:left;padding:8px 10px;font-size:10px;font-weight:600;color:#4a6a8a;text-transform:uppercase;letter-spacing:0.08em;border-bottom:1px solid #1e2d42}
.comp-table td{padding:10px 10px;border-bottom:1px solid #1a2535;color:#e0e8f0}
.comp-table tr:last-child td{border-bottom:none}
.reg-card{background:#131e2e;border:1px solid #1e2d42;border-radius:10px;padding:12px 16px;margin-bottom:8px}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;background:rgba(255,255,255,0.06);color:#8aaac0;border:1px solid rgba(255,255,255,0.1);margin:2px}
.loading{text-align:center;padding:4rem;color:#4a6a8a}
.spinner{width:28px;height:28px;border:2px solid #1e2d42;border-top-color:#2e7dd1;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:600px){.kpi-grid,.estado-grid{grid-template-columns:repeat(2,1fr)}}
</style>

const COMBS=[
  {k:"gc",l:"Gasolina Comum"},
  {k:"ga",l:"Gasolina Aditivada"},
  {k:"et",l:"Etanol"},
  {k:"eta",l:"Etanol Aditivado"},
  {k:"ds",l:"Diesel S10"},
  {k:"ds500",l:"Diesel S500"},
  {k:"dsa",l:"Diesel S10 Aditivado"},
];

const BCLS={Ipiranga:"b-ipa",Shell:"b-she",BR:"b-br","Trapézio":"b-tra",RDP:"b-rdp",TOF:"b-oth"};
const ESTADOS=["Todos","PR","RS","SC","SP"];

let S={dados:[],loading:true,aba:"geral",estado:"Todos",busca:"",det:null};

async function carregarDados(){
  S.loading=true; render();
  try {
    const hoje=new Date().toISOString().split('T')[0];
    const url=`${SUPABASE_URL}/rest/v1/registros?criado_em=gte.${hoje}T00:00:00&select=posto_id,concorrente_nome,concorrente_bandeira,gc,ga,et,eta,ds,ds500,dsa,lat,lng,ia_usada,foto_url,criado_em`;
    const resp=await fetch(url,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
    const regs=await resp.json();

    // Agrupa por posto
    const mapa={};
    for(const r of regs){
      if(!mapa[r.posto_id]) mapa[r.posto_id]=[];
      mapa[r.posto_id].push(r);
    }

    S.dados=POSTOS.map(p=>{
      const regs=mapa[p.id]||[];
      const registrou=regs.length>0;
      const concorrentes=regs.length;

      // Calcula médias dos concorrentes por combustível
      const medias={};
      for(const {k} of COMBS){
        const vals=regs.filter(r=>r[k]>0).map(r=>parseFloat(r[k]));
        medias[k]=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length):null;
      }

      return{...p,registrou,concorrentes,regs,medias};
    });
  } catch(e){
    console.error('Erro Supabase:',e);
    S.dados=POSTOS.map(p=>({...p,registrou:false,concorrentes:0,regs:[],medias:{}}));
  }
  S.loading=false; render();
}

function bcls(b){return BCLS[b]||"b-oth";}
function filtrados(){
  return S.dados
    .filter(p=>S.estado==="Todos"||p.estado===S.estado)
    .filter(p=>p.nome.toLowerCase().includes(S.busca.toLowerCase())||p.cidade.toLowerCase().includes(S.busca.toLowerCase()));
}

        <div class="logo-name">Grupo Trapézio</div>

      <span class="pill pill-date">${d}</span>
      <span class="pill pill-live">● Ao vivo</span>
      <button class="btn-top" onclick="carregarDados()">Atualizar</button>
    </div>
  </div>`;
}

function renderDash(){
  const d=S.dados,tot=d.length;
  const reg=d.filter(p=>p.registrou).length;
  const pend=tot-reg;
  const alrt=d.filter(p=>p.registrou&&Object.values(p.medias).some(v=>v!==null)).length;
  const pct=Math.round(reg/tot*100);
  const df=filtrados();

  const kpis=[
    {cls:"kpi-0",l:"Total de postos",v:tot,s:"PR · RS · SC · SP"},
    {cls:"kpi-1",l:"Registraram hoje",v:reg,s:`${pct}% da rede`},
    {cls:"kpi-2",l:"Aguardando",v:pend,s:"sem registro hoje"},
    {cls:"kpi-3",l:"Com dados reais",v:alrt,s:"concorrentes registrados"},
  ];

  const pe=["PR","RS","SC","SP"].map(e=>{
    const tot=d.filter(p=>p.estado===e).length;
    const ok=d.filter(p=>p.estado===e&&p.registrou).length;
    const pct=tot?Math.round(ok/tot*100):0;
    const cor=pct===100?"#4dd87a":pct>=70?"#2e7dd1":"#e24b4a";
    return`<div class="estado-card">
      <div class="estado-top">
        <span class="estado-nome">${e}</span>
        <span style="font-size:13px;font-weight:600;color:${cor}">${pct}%</span>
      </div>
      <div class="prog-wrap"><div class="prog-bar" style="width:${pct}%;background:${cor}"></div></div>
      <div class="estado-frac">${ok}/${tot} registraram</div>
    </div>`;
  }).join('');

  const rows=()=>{
    if(S.aba==="geral"){
      if(!df.length) return`<div class="empty">Nenhum posto encontrado.</div>`;
      return df.map(p=>`
        <div class="posto-row${p.registrou&&Object.values(p.medias).some(v=>v)?' alerta':''}" onclick="abrirDet('${p.id}')">
          <div class="row-left">
            <span class="dot ${p.registrou?'dot-g':'dot-r'}"></span>
            <div style="min-width:0">
              <div class="row-nome">${p.nome}</div>
              <div class="row-sub">${p.cidade} · ${p.estado}</div>
            </div>
          </div>
          <div class="row-right">
            <span class="badge ${bcls(p.bandeira)}">${p.bandeira}</span>
            ${p.registrou?`<span style="font-size:11px;color:#4a6a8a;">${p.concorrentes} conc.</span>`:''}
            ${!p.registrou?`<span class="badge b-amb">Pendente</span>`:''}
            <span class="chevron">›</span>
          </div>
        </div>`).join('');
    }
    if(S.aba==="pendentes"){
      const lista=df.filter(p=>!p.registrou);
      if(!lista.length) return`<div class="empty">Todos os postos registraram hoje!</div>`;
      return lista.map(p=>`
        <div class="pend-row">
          <div>
            <div style="font-weight:500;font-size:13px;color:#e0e8f0;">${p.nome}</div>
            <div style="font-size:11px;color:#f0a030;margin-top:2px;">${p.cidade} · ${p.estado} · Sem registro hoje</div>
          </div>
          <span class="badge b-amb">Pendente</span>
        </div>`).join('');
    }
    if(S.aba==="registros"){
      // Todos os registros do dia
      const todos=S.dados.flatMap(p=>p.regs.map(r=>({...r,postoNome:p.nome,postoCidade:p.cidade,postoEstado:p.estado})));
      if(!todos.length) return`<div class="empty">Nenhum registro hoje ainda.</div>`;
      return todos.sort((a,b)=>new Date(b.criado_em)-new Date(a.criado_em)).map(r=>`
        <div class="reg-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <div>
              <div style="font-weight:500;font-size:13px;">${r.postoNome}</div>
              <div style="font-size:11px;color:#4a6a8a;">${r.postoEstado} · ${r.concorrente_nome||'—'} · <span class="badge ${bcls(r.concorrente_bandeira)}" style="font-size:9px;">${r.concorrente_bandeira||'—'}</span></div>
            </div>
            <div style="font-size:11px;color:#4a6a8a;">${new Date(r.criado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:4px">
            ${COMBS.filter(c=>r[c.k]>0).map(c=>`<span class="tag">${c.l}: R$ ${parseFloat(r[c.k]).toFixed(2)}</span>`).join('')}
          </div>
        </div>`).join('');
    }
    return '';
  };

  const totalRegs=S.dados.reduce((s,p)=>s+p.regs.length,0);

  return`${topbar()}
  <div class="content">
    <div class="kpi-grid">
      ${kpis.map(k=>`<div class="kpi ${k.cls}"><div class="kpi-label">${k.l}</div><div class="kpi-val">${k.v}</div><div class="kpi-sub">${k.s}</div></div>`).join('')}
    </div>
    <div class="sec-label">Adesão por estado</div>
    <div class="estado-grid">${pe}</div>
    <div class="sec-label">Postos</div>
    <div class="tabs">
      <button class="tab ${S.aba==='geral'?'on':''}" onclick="setAba('geral')">Visão geral</button>
      <button class="tab ${S.aba==='pendentes'?'on':''}" onclick="setAba('pendentes')">Pendentes (${pend})</button>
      <button class="tab ${S.aba==='registros'?'on':''}" onclick="setAba('registros')">Registros hoje (${totalRegs})</button>
    </div>
    <div class="toolbar">
      <input class="input-s" type="text" placeholder="Buscar posto ou cidade..." value="${S.busca}" oninput="setBusca(this.value)">
      ${ESTADOS.map(e=>`<button class="btn-est ${S.estado===e?'on':''}" onclick="setEst('${e}')">${e}</button>`).join('')}
    </div>
    ${rows()}
  </div>`;
}

function renderDet(){
  const p=S.det;
  return`${topbar()}
  <div class="content">
    <div class="det-header">
      <button class="btn-back" onclick="fecharDet()">←</button>
      <div>
        <div style="font-size:11px;color:#4a6a8a;text-transform:uppercase;letter-spacing:0.05em;">${p.cidade} · ${p.estado}</div>
        <div style="font-size:18px;font-weight:700;">${p.nome}</div>
      </div>
      <span class="badge ${bcls(p.bandeira)}" style="margin-left:auto">${p.bandeira}</span>
    </div>

    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px">
      <div class="kpi kpi-0"><div class="kpi-label">Status</div><div style="font-size:16px;font-weight:700;color:#fff">${p.registrou?'Registrou':'Pendente'}</div></div>
      <div class="kpi kpi-1"><div class="kpi-label">Concorrentes</div><div style="font-size:24px;font-weight:700;color:#fff">${p.concorrentes}</div></div>
      <div class="kpi kpi-2"><div class="kpi-label">Registros hoje</div><div style="font-size:24px;font-weight:700;color:#fff">${p.regs.length}</div></div>
    </div>

    ${p.regs.length===0
      ? `<div class="empty">Nenhum registro hoje para este posto.</div>`
      : p.regs.map(r=>`
        <div class="comp-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <div>
              <div style="font-weight:600;font-size:14px;">${r.concorrente_nome||'Sem nome'}</div>
              <span class="badge ${bcls(r.concorrente_bandeira)}">${r.concorrente_bandeira||'—'}</span>
            </div>
            <div style="font-size:11px;color:#4a6a8a">${new Date(r.criado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>
          </div>
          ${r.foto_url ? `
          <div style="margin-top:12px;">
            <div style="font-size:11px;color:#8aaac0;margin-bottom:6px;">Foto do painel</div>
            <img src="${r.foto_url}" onclick="window.open('${r.foto_url}','_blank')"
              style="width:100%;max-height:220px;object-fit:contain;border-radius:8px;background:#0f1520;cursor:pointer;border:1px solid #1e2d42;">
          </div>` : ''}
          <table class="comp-table">
            <thead><tr>
              <th>Combustível</th>
              <th style="text-align:right">Preço</th>
            </tr></thead>
            <tbody>
              ${COMBS.filter(c=>r[c.k]>0).map(c=>`
                <tr>
                  <td>${c.l}</td>
                  <td style="text-align:right;font-weight:600;color:#4dd87a">R$ ${parseFloat(r[c.k]).toFixed(2)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
          <div style="margin-top:12px;padding-top:12px;border-top:1px solid #1e2d42;display:flex;gap:12px;flex-wrap:wrap">
            <div style="font-size:11px;color:#4a6a8a;">
              <span style="color:#8aaac0;">Data/hora:</span> ${new Date(r.criado_em).toLocaleString('pt-BR')}
            </div>
            ${r.lat && r.lng ? `
              <div style="font-size:11px;color:#4a6a8a;">
                <span style="color:#8aaac0;">Localização:</span>
                <a href="https://www.google.com/maps?q=${r.lat},${r.lng}" target="_blank"
                  style="color:#2e7dd1;text-decoration:none;font-weight:600;">
                  ${parseFloat(r.lat).toFixed(4)}, ${parseFloat(r.lng).toFixed(4)} ↗
                </a>
              </div>
              <div style="font-size:11px;">
                <span style="background:rgba(77,216,122,0.12);color:#4dd87a;border:1px solid rgba(77,216,122,0.3);padding:2px 8px;border-radius:5px;font-weight:600;">GPS verificado</span>
              </div>
            ` : `
              <div style="font-size:11px;">
                <span style="background:rgba(186,117,23,0.15);color:#f0a030;border:1px solid rgba(186,117,23,0.3);padding:2px 8px;border-radius:5px;font-weight:600;">Sem GPS</span>
              </div>
            `}
          </div>
        </div>`).join('')}
  </div>`;
}

function render(){
  if(S.loading){
    document.getElementById('app').innerHTML=`${topbar()}<div class="content"><div class="loading"><div class="spinner"></div>Carregando dados do Supabase...</div></div>`;
    return;
  }
  document.getElementById('app').innerHTML=S.det?renderDet():renderDash();
}

function setAba(v){S.aba=v;render()}
function setEst(v){S.estado=v;render()}
function setBusca(v){S.busca=v;render()}
function abrirDet(id){S.det=S.dados.find(p=>p.id===id);render()}
function fecharDet(){S.det=null;render()}

// Auto-refresh a cada 3 minutos
setInterval(carregarDados,3*60*1000);

carregarDados();
</script>
</body>
</html>
