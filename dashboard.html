*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1520;color:#e0e8f0;min-height:100vh}

.topbar{background:#111927;border-bottom:1px solid #1e2d42;padding:0 16px;display:flex;justify-content:space-between;align-items:center;height:56px;position:sticky;top:0;z-index:100}
.logo-name{font-size:16px;font-weight:800;color:#fff;letter-spacing:0.06em;text-transform:uppercase;font-style:italic}
.logo-sub{font-size:9px;color:#4a6a8a;letter-spacing:0.15em;text-transform:uppercase}
.topbar-right{display:flex;align-items:center;gap:8px}
.pill-live{font-size:11px;padding:3px 8px;border-radius:20px;background:rgba(46,209,100,0.15);color:#4dd87a;border:1px solid rgba(46,209,100,0.3)}
.btn-top{font-size:12px;padding:5px 12px;border-radius:6px;border:1px solid #2a4060;background:transparent;color:#8aaac0;cursor:pointer}

.content{padding:14px 16px}

.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:600px){.kpi-grid{grid-template-columns:repeat(4,1fr)}}
.kpi{border-radius:12px;padding:14px 16px}
.kpi-0{background:linear-gradient(135deg,#1a3a6b,#2e7dd1)}
.kpi-1{background:linear-gradient(135deg,#0f6e56,#1D9E75)}
.kpi-2{background:linear-gradient(135deg,#633806,#EF9F27)}
.kpi-3{background:linear-gradient(135deg,#791F1F,#E24B4A)}
.kpi-label{font-size:10px;color:rgba(255,255,255,0.7);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:6px}
.kpi-val{font-size:28px;font-weight:700;color:#fff;line-height:1}
.kpi-sub{font-size:11px;color:rgba(255,255,255,0.6);margin-top:4px}

.estado-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:600px){.estado-grid{grid-template-columns:repeat(4,1fr)}}
.estado-card{background:#131e2e;border:1px solid #1e2d42;border-radius:10px;padding:12px 14px}
.estado-nome{font-size:18px;font-weight:700;color:#fff}
.prog-wrap{height:5px;background:#1e2d42;border-radius:3px;overflow:hidden;margin:8px 0 4px}
.prog-bar{height:100%;border-radius:3px;transition:width 0.8s}
.estado-frac{font-size:11px;color:#4a6a8a}

.sec-label{font-size:10px;font-weight:600;color:#4a6a8a;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:10px;display:flex;align-items:center;gap:8px}

.filtros-row{display:flex;gap:8px;flex-wrap:wrap}
.input-s{width:100%;padding:9px 14px;font-size:14px;border-radius:8px;border:1px solid #1e2d42;background:#131e2e;color:#e0e8f0;outline:none}

const COMBS=[
  {k:"gc",l:"Gasolina Comum"},{k:"ga",l:"Gasolina Aditivada"},
  {k:"et",l:"Etanol"},{k:"eta",l:"Etanol Aditivado"},
  {k:"ds",l:"Diesel S10"},{k:"ds500",l:"Diesel S500"},{k:"dsa",l:"Diesel S10 Aditivado"},
];
const BCLS={
  Ipiranga:"b-ipa", Shell:"b-she", BR:"b-br",
  "Trapézio":"b-tra", Petrobras:"b-br", "Raízen":"b-br",
  RDP:"b-rdp", TOF:"b-oth", "Bandeira Branca":"b-bca"
};

function bcls(b){return BCLS[b]||"b-oth";}

async function carregarDados(){
  S.loading=true; renderAll();
  try{
    const dataInicio=new Date(Date.now()-((S.dias-1)*24*60*60*1000)).toISOString().split('T')[0];
    const url=`${SUPABASE_URL}/rest/v1/registros?criado_em=gte.${dataInicio}T00:00:00&select=posto_id,concorrente_nome,concorrente_bandeira,gc,ga,et,eta,ds,ds500,dsa,lat,lng,ia_usada,foto_url,criado_em,is_proprio_posto`;
    const resp=await fetch(url,{headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`}});
    const regs=await resp.json();
    const mapa={};
    for(const r of regs){if(!mapa[r.posto_id])mapa[r.posto_id]=[];mapa[r.posto_id].push(r);}
    S.dados=POSTOS.map(p=>{
      const rs=mapa[p.id]||[];
      // Separa concorrentes do próprio
      const concorrentes = rs.filter(r => !r.is_proprio_posto);
      const propriosOrdenados = rs.filter(r => r.is_proprio_posto)
        .sort((a,b)=>new Date(b.criado_em)-new Date(a.criado_em));
      const proprio = propriosOrdenados[0] || null;

      // Análise por combustível: nosso vs menor vs maior dos concorrentes
      const analise={};
      for(const {k} of COMBS){
        const vals=concorrentes.filter(r=>r[k]>0).map(r=>parseFloat(r[k]));
        const nosso = proprio && proprio[k] ? parseFloat(proprio[k]) : null;
        if(!vals.length && !nosso){ analise[k]=null; continue; }
        analise[k]={
          nosso,
          menor: vals.length ? Math.min(...vals) : null,
          maior: vals.length ? Math.max(...vals) : null,
          media: vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null,
          nConcorrentes: vals.length,
        };
      }
      return {
        ...p,
        registrou: concorrentes.length>0,
        proprioRegistrado: !!proprio,
        concorrentes: concorrentes.length,
        regs: concorrentes,
        proprio,
        analise,
      };
    });
  }catch(e){
    console.error('Erro carregar:',e);
    S.dados=POSTOS.map(p=>({...p,registrou:false,proprioRegistrado:false,concorrentes:0,regs:[],proprio:null,analise:{}}));
  }
  S.loading=false; renderAll();
}

}

function renderDash(){
  const d=S.dados,tot=d.length;
  const reg=d.filter(p=>p.registrou).length;
  const comProprio=d.filter(p=>p.proprioRegistrado).length;
  const pend=tot-reg;
  const totalRegs=d.reduce((s,p)=>s+p.regs.length,0);
  const pct=Math.round(reg/tot*100);
  const df=filtrados();

  const kpisHtml=`<div class="kpi-grid">
    ${[
      {cls:"kpi-0",l:"Total postos",v:tot,s:"PR·RS·SC·SP"},
      {cls:"kpi-1",l:"Registraram",v:reg,s:`${pct}% da rede`},
      {cls:"kpi-2",l:"Com painel próprio",v:comProprio,s:"meta + foto do posto"},
      {cls:"kpi-3",l:"Pendentes",v:pend,s:"sem registro"},
    ].map(k=>`<div class="kpi ${k.cls}"><div class="kpi-label">${k.l}</div><div class="kpi-val">${k.v}</div><div class="kpi-sub">${k.s}</div></div>`).join('')}
  </div>`;

  const estadosHtml=`<div class="sec-label">Por estado</div><div class="estado-grid">
    ${["PR","RS","SC","SP"].map(e=>{
      const et=d.filter(p=>p.estado===e).length;
      const eo=d.filter(p=>p.estado===e&&p.registrou).length;
      const ep=et?Math.round(eo/et*100):0;
      const cor=ep===100?"#4dd87a":ep>=70?"#2e7dd1":"#e24b4a";
      return`<div class="estado-card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span class="estado-nome">${e}</span>
          <span style="font-size:13px;font-weight:700;color:${cor}">${ep}%</span>
        </div>
        <div class="prog-wrap"><div class="prog-bar" style="width:${ep}%;background:${cor}"></div></div>
        <div class="estado-frac">${eo}/${et} registraram</div>
      </div>`;
    }).join('')}
  </div>`;

  let rowsHtml='';
  if(S.aba==="geral"){
    rowsHtml=df.length===0?`<div class="empty">Nenhum posto encontrado.</div>`:
      df.map(p=>`
        <div class="posto-row" onclick="abrirDet('${p.id}')">
          <div class="row-left">
            <span class="dot ${statusDot(p)}"></span>
            <div style="min-width:0">
              <div class="row-nome">${p.nome}</div>
              <div class="row-sub">${p.cidade} · ${p.estado}</div>
            </div>
          </div>
          <div class="row-right">
            <span class="badge ${bcls(p.bandeira)}">${p.bandeira}</span>
            ${p.proprioRegistrado?`<span class="badge b-blue">Próprio</span>`:''}
            ${p.registrou?`<span style="font-size:11px;color:#4a6a8a;">${p.concorrentes}</span>`:''}
            ${!p.registrou?`<span class="badge b-amb">Pendente</span>`:''}
            <span class="chevron">›</span>
          </div>
        </div>`).join('');
  } else if(S.aba==="pendentes"){
    const lista=df.filter(p=>!p.registrou);
    rowsHtml=lista.length===0?`<div class="empty">Todos registraram hoje!</div>`:
      lista.map(p=>`
        <div class="pend-row">
          <div>
            <div style="font-weight:500;font-size:13px;color:#e0e8f0;">${p.nome}</div>
            <div style="font-size:11px;color:#f0a030;margin-top:2px;">${p.cidade} · ${p.estado}</div>
          </div>
          <span class="badge b-amb">Pendente</span>
        </div>`).join('');
  } else if(S.aba==="sem-proprio"){
    const lista=df.filter(p=>p.registrou && !p.proprioRegistrado);
    rowsHtml=lista.length===0?`<div class="empty">Todos com painel próprio!</div>`:
      lista.map(p=>`
        <div class="posto-row" onclick="abrirDet('${p.id}')">
          <div class="row-left">
            <span class="dot dot-y"></span>
            <div style="min-width:0">
              <div class="row-nome">${p.nome}</div>
              <div class="row-sub">${p.cidade} · ${p.estado} · ${p.concorrentes} concorrentes, falta painel próprio</div>
            </div>
          </div>
          <div class="row-right">
            <span class="badge ${bcls(p.bandeira)}">${p.bandeira}</span>
            <span class="chevron">›</span>
          </div>
        </div>`).join('');
  } else if(S.aba==="registros"){
    const todos=df.flatMap(p=>p.regs.map(r=>({...r,pNome:p.nome,pEstado:p.estado})));
    rowsHtml=todos.length===0?`<div class="empty">Nenhum registro hoje.</div>`:
      todos.sort((a,b)=>new Date(b.criado_em)-new Date(a.criado_em)).map(r=>`
        <div class="comp-card" style="cursor:pointer" onclick="abrirDet('${r.posto_id}')">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px">
            <div>
              <div style="font-weight:500;font-size:13px;">${r.pNome}</div>
              <div style="font-size:11px;color:#4a6a8a;">${r.concorrente_nome||'—'} · <span class="badge ${bcls(r.concorrente_bandeira)}" style="font-size:9px;">${r.concorrente_bandeira||'—'}</span></div>
            </div>
            <div style="font-size:11px;color:#4a6a8a">${new Date(r.criado_em).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}</div>
          </div>
          <div>${COMBS.filter(c=>r[c.k]>0).map(c=>`<span class="tag">${c.l}: R$ ${parseFloat(r[c.k]).toFixed(2)}</span>`).join('')}</div>
        </div>`).join('');
  }

  const semProprioCount = d.filter(p=>p.registrou && !p.proprioRegistrado).length;

  document.getElementById('content').innerHTML=`
    ${S.loading?`<div class="loading"><div class="spinner"></div>Carregando...</div>`:`
    ${kpisHtml}
    ${estadosHtml}
    <div class="sec-label">Postos</div>
    <div class="tabs">
      <button class="tab ${S.aba==='geral'?'on':''}" onclick="setAba('geral')">Todos (${tot})</button>
      <button class="tab ${S.aba==='pendentes'?'on':''}" onclick="setAba('pendentes')">Pendentes (${pend})</button>
      <button class="tab ${S.aba==='sem-proprio'?'on':''}" onclick="setAba('sem-proprio')">Sem painel próprio (${semProprioCount})</button>
      <button class="tab ${S.aba==='registros'?'on':''}" onclick="setAba('registros')">Registros (${totalRegs})</button>
    </div>
    <div class="filtros">
      <input class="input-s" id="busca-input" type="text" placeholder="Buscar posto ou cidade..." value="${S.busca}">
      <div class="filtros-row">
        <select class="select-s" id="posto-select" onchange="setPostoFiltro(this.value)">
          <option value="">Todos os postos</option>
          ${POSTOS.map(p=>`<option value="${p.id}" ${S.postoFiltro===p.id?'selected':''}>${p.nome} · ${p.cidade}</option>`).join('')}
        </select>
        ${["Todos","PR","RS","SC","SP"].map(e=>`<button class="btn-est ${S.estado===e?'on':''}" onclick="setEst('${e}')">${e}</button>`).join('')}
      </div>
    </div>
    ${rowsHtml}`}`;

  const bi=document.getElementById('busca-input');
  if(bi){
    bi.addEventListener('input',e=>{S.busca=e.target.value;renderDash();});
    bi.addEventListener('focus',()=>{bi.setSelectionRange(bi.value.length,bi.value.length);});
  }
}

function diffBadge(nosso, menor, maior) {
  if (nosso === null || menor === null || maior === null) return `<span class="diff-pos diff-gray">—</span>`;
  if (nosso > maior) return `<span class="diff-pos diff-red">+R$ ${(nosso-maior).toFixed(2)} acima do maior</span>`;
  if (nosso < menor) return `<span class="diff-pos diff-grn">−R$ ${(menor-nosso).toFixed(2)} abaixo do menor</span>`;
  // Está na faixa: mostra posição relativa
  const posDoMaior = (maior - nosso).toFixed(2);
  const posDoMenor = (nosso - menor).toFixed(2);
  if (Math.abs(maior - nosso) < Math.abs(nosso - menor)) {
    return `<span class="diff-pos diff-amb">R$ ${posDoMaior} abaixo do maior</span>`;
  }
  return `<span class="diff-pos diff-amb">R$ ${posDoMenor} acima do menor</span>`;
}

function renderAnaliseDif(p) {
  if (!p.proprio) {
    return `
      <div class="analise-card" style="background:linear-gradient(135deg,#3a2a00,#1a1500);border-color:#3a2a00;">
        <div class="analise-title">⚠️ Painel próprio não registrado</div>
        <div style="font-size:12px;color:#f0a030;">Sem o painel do próprio posto, não dá pra comparar com o mercado. Avise o gerente.</div>
      </div>`;
  }

  const linhas = COMBS.map(({k,l}) => {
    const a = p.analise[k];
    if (!a || (a.nosso === null && a.menor === null)) return '';
    const nosso = a.nosso !== null ? `R$ ${a.nosso.toFixed(2)}` : '—';
    const menor = a.menor !== null ? `R$ ${a.menor.toFixed(2)}` : '—';
    const maior = a.maior !== null ? `R$ ${a.maior.toFixed(2)}` : '—';
    return `
      <div class="analise-row">
        <div class="lbl">${l}</div>
        <div class="val val-nosso">${nosso}</div>
        <div class="val val-menor">${menor}</div>
        <div class="val val-maior">${maior}</div>
        <div>${diffBadge(a.nosso, a.menor, a.maior)}</div>
      </div>`;
  }).filter(Boolean).join('');

  if (!linhas) {
    return `<div class="analise-card"><div class="analise-title">📊 Análise de diferenças</div>
      <div style="font-size:12px;color:#8aaac0;">Sem dados de concorrentes para comparar ainda.</div></div>`;
  }

  return `
    <div class="analise-card">
      <div class="analise-title">📊 Análise de diferenças — nosso preço vs concorrentes</div>
      <div class="analise-row" style="font-weight:600;color:#4a6a8a;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;">
        <div>Combustível</div>
        <div style="text-align:right;color:#7ab8f0;">Nosso</div>
        <div style="text-align:right;color:#4dd87a;">Menor conc.</div>
        <div style="text-align:right;color:#e24b4a;">Maior conc.</div>
        <div style="text-align:right;">Posição</div>
      </div>
      ${linhas}
    </div>`;
}

function renderDet(){
  const p=S.det;
  return`
    <div class="det-header">
      <button class="btn-back" onclick="fecharDet()">←</button>
      <div style="flex:1;min-width:0">
        <div style="font-size:11px;color:#4a6a8a;text-transform:uppercase;">${p.cidade} · ${p.estado}</div>
        <div style="font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.nome}</div>
      </div>
      <span class="badge ${bcls(p.bandeira)}">${p.bandeira}</span>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px">
      <div class="kpi kpi-0" style="padding:12px 14px"><div class="kpi-label">Status</div><div style="font-size:14px;font-weight:700;color:#fff">${p.proprioRegistrado?'Completo':p.registrou?'Parcial':'Pendente'}</div></div>
      <div class="kpi kpi-1" style="padding:12px 14px"><div class="kpi-label">Concorrentes</div><div style="font-size:22px;font-weight:700;color:#fff">${p.concorrentes}</div></div>
      <div class="kpi kpi-2" style="padding:12px 14px"><div class="kpi-label">Painel próprio</div><div style="font-size:14px;font-weight:700;color:#fff">${p.proprioRegistrado?'Sim':'Não'}</div></div>
    </div>

    ${renderAnaliseDif(p)}

    ${p.proprio ? `
      <div class="sec-label">Painel do próprio posto</div>
      <div class="comp-card" style="border-color:#2a4060;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <div>
            <div style="font-weight:600;font-size:14px;color:#7ab8f0;">📍 ${p.nome}</div>
            <span class="badge b-blue">Próprio posto</span>
            ${p.proprio.ia_usada?`<span class="badge b-grn" style="margin-left:4px">IA</span>`:''}
          </div>
          <div style="font-size:11px;color:#4a6a8a">${new Date(p.proprio.criado_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
        </div>
        ${p.proprio.foto_url?`<img src="${p.proprio.foto_url}" onclick="window.open('${p.proprio.foto_url}','_blank')" style="width:100%;max-height:200px;object-fit:contain;border-radius:8px;background:#0f1520;cursor:pointer;border:1px solid #1e2d42;margin-bottom:10px">`:''}
        <table class="comp-table">
          <thead><tr><th>Combustível</th><th style="text-align:right">Preço</th></tr></thead>
          <tbody>${COMBS.filter(c=>p.proprio[c.k]>0).map(c=>`<tr><td>${c.l}</td><td style="text-align:right;font-weight:600;color:#7ab8f0">R$ ${parseFloat(p.proprio[c.k]).toFixed(2)}</td></tr>`).join('')}</tbody>
        </table>
      </div>
    ` : ''}

    <div class="sec-label">Concorrentes (${p.regs.length})</div>
    ${p.regs.length===0?`<div class="empty">Nenhum concorrente registrado.</div>`:
      p.regs.map(r=>`
        <div class="comp-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div>
              <div style="font-weight:600;font-size:14px;">${r.concorrente_nome||'Sem nome'}</div>
              <span class="badge ${bcls(r.concorrente_bandeira)}">${r.concorrente_bandeira||'—'}</span>
              ${r.ia_usada?`<span class="badge b-grn" style="margin-left:4px">IA</span>`:''}
            </div>
            <div style="font-size:11px;color:#4a6a8a">${new Date(r.criado_em).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
          </div>
          ${r.foto_url?`<img src="${r.foto_url}" onclick="window.open('${r.foto_url}','_blank')" style="width:100%;max-height:200px;object-fit:contain;border-radius:8px;background:#0f1520;cursor:pointer;border:1px solid #1e2d42;margin-bottom:10px">`:''}
          <table class="comp-table">
            <thead><tr><th>Combustível</th><th style="text-align:right">Preço</th></tr></thead>
            <tbody>${COMBS.filter(c=>r[c.k]>0).map(c=>`<tr><td>${c.l}</td><td style="text-align:right;font-weight:600;color:#4dd87a">R$ ${parseFloat(r[c.k]).toFixed(2)}</td></tr>`).join('')}</tbody>
          </table>
          <div style="margin-top:10px;padding-top:10px;border-top:1px solid #1e2d42;display:flex;gap:10px;flex-wrap:wrap;font-size:11px;">
            <span style="color:#8aaac0">${new Date(r.criado_em).toLocaleString('pt-BR')}</span>
            ${r.lat&&r.lng?`<a href="https://www.google.com/maps?q=${r.lat},${r.lng}" target="_blank" style="color:#2e7dd1;font-weight:600;text-decoration:none">Ver no mapa ↗</a><span class="badge b-grn">GPS verificado</span>`:`<span class="badge b-amb">Sem GPS</span>`}
          </div>
        </div>`).join('')}`;
}

function setDias(v){S.dias=v;carregarDados();}
function setAba(v){S.aba=v;renderDash()}
function setEst(v){S.estado=v;renderDash();}
function setPostoFiltro(v){S.postoFiltro=v;renderDash();}
function abrirDet(id){S.det=S.dados.find(p=>p.id===id);renderAll();}
function fecharDet(){S.det=null;renderAll();}

setInterval(carregarDados,3*60*1000);
carregarDados();
</script>
</body>
</html>
