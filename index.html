function slugify(str) {
  return str.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-|-$/g, '');
}

  return POSTOS.find(p => slugify(p.nome) === param) || null;

// ── Histórico em localStorage ───────────────────────────────
function getHistorico(postoId) {
  try {
    const raw = localStorage.getItem(`trapezio_hist_${postoId}`);
    if (!raw) return [];
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch(e) { return []; }
}
function salvarHistorico(postoId, nome, bandeira) {
  if (!nome || !nome.trim()) return;
  try {
    const hist = getHistorico(postoId);
    const filtrado = hist.filter(h => h.nome.toLowerCase() !== nome.toLowerCase());
    filtrado.unshift({ nome: nome.trim(), bandeira: bandeira || 'Outros', ts: Date.now() });
    localStorage.setItem(`trapezio_hist_${postoId}`, JSON.stringify(filtrado.slice(0, 20)));
  } catch(e) {}
}

// ── Comparação preço próprio vs concorrentes (menor e maior) ──
function compararProprioVsMercado(combKey) {
  if (!state.proprio || !state.proprio[combKey]) return null;
  const nosso = parseFloat(state.proprio[combKey]);
  const vals = state.registros
    .filter(r => r[combKey])
    .map(r => parseFloat(r[combKey]))
    .filter(v => !isNaN(v) && v > 0);
  if (!vals.length) return { nosso, menor:null, maior:null };
  return { nosso, menor: Math.min(...vals), maior: Math.max(...vals) };
}

// ── Image / OCR ─────────────────────────────────────────────
async function melhorarImagem(file) {
  return new Promise((res) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const canvas = document.createElement('canvas');
      const escala = Math.min(1200 / img.width, 1200 / img.height, 2);
      canvas.width = img.width * escala;
      canvas.height = img.height * escala;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const id = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const d = id.data;
      let totalBrilho = 0;
      for (let i = 0; i < d.length; i += 16) totalBrilho += (d[i] + d[i+1] + d[i+2]) / 3;
      const brilhoMedio = totalBrilho / (d.length / 16);
      if (brilhoMedio < 80) {
        for (let i = 0; i < d.length; i += 4) {
          d[i]   = Math.min(255, d[i]   * 2.0 + 40);
          d[i+1] = Math.min(255, d[i+1] * 2.0 + 40);
          d[i+2] = Math.min(255, d[i+2] * 2.0 + 40);
        }
      } else if (brilhoMedio < 120) {
        for (let i = 0; i < d.length; i += 4) {
          d[i]   = Math.min(255, d[i]   * 1.4 + 15);
          d[i+1] = Math.min(255, d[i+1] * 1.4 + 15);
          d[i+2] = Math.min(255, d[i+2] * 1.4 + 15);
        }
      } else if (brilhoMedio > 200) {
        for (let i = 0; i < d.length; i += 4) {
          d[i]   = Math.min(255, Math.max(0, (d[i]   - 128) * 1.4 + 100));
          d[i+1] = Math.min(255, Math.max(0, (d[i+1] - 128) * 1.4 + 100));
          d[i+2] = Math.min(255, Math.max(0, (d[i+2] - 128) * 1.4 + 100));
        }
      } else if (brilhoMedio > 160) {
        for (let i = 0; i < d.length; i += 4) {
          d[i]   = Math.min(255, Math.max(0, (d[i]   - 128) * 1.2 + 110));
          d[i+1] = Math.min(255, Math.max(0, (d[i+1] - 128) * 1.2 + 110));
          d[i+2] = Math.min(255, Math.max(0, (d[i+2] - 128) * 1.2 + 110));
        }
      }
      ctx.putImageData(id, 0, 0);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob => res(blob || file), 'image/jpeg', 0.92);
    };
    img.onerror = () => res(file);
    img.src = url;
  });
}

async function lerFotoComIA(file) {
  const fileOtimizado = await melhorarImagem(file);
  const b64 = await new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(fileOtimizado);
  });
  const resp = await fetch('/api/ocr', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ image: b64, mediaType: file.type || 'image/jpeg' }),
  });
  const data = await resp.json();
  if (data.error) throw new Error(data.error);
  return data;
}

async function uploadFoto(file, postoId) {
  try {
    const ext = file.type === 'image/png' ? 'png' : 'jpg';
    const nome = `${postoId}/${Date.now()}.${ext}`;
    const resp = await fetch(`${CONFIG.SUPABASE_URL}/storage/v1/object/fotos/${nome}`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${CONFIG.SUPABASE_KEY}`,
        'apikey': CONFIG.SUPABASE_KEY,
        'Content-Type': file.type,
        'x-upsert': 'true',
      },
      body: file,
    });
    if (!resp.ok) throw new Error(await resp.text());
    return `${CONFIG.SUPABASE_URL}/storage/v1/object/public/fotos/${nome}`;
  } catch(e) { console.error('upload:', e); return null; }
}

// ── Validação ───────────────────────────────────────────────
function validarPrecos(f) {
  const alertas = [];
  const gc=parseFloat(f.gc)||0, ga=parseFloat(f.ga)||0;
  const et=parseFloat(f.et)||0, eta=parseFloat(f.eta)||0;
  const ds=parseFloat(f.ds)||0, ds500=parseFloat(f.ds500)||0, dsa=parseFloat(f.dsa)||0;

  if (et > 0 && gc > 0 && et >= gc)
    alertas.push(`Etanol (R$ ${et.toFixed(2)}) deveria ser mais barato que Gasolina Comum (R$ ${gc.toFixed(2)})`);
  if (ga > 0 && gc > 0 && ga < gc)
    alertas.push(`Gasolina Aditivada (R$ ${ga.toFixed(2)}) deveria ser >= Gasolina Comum (R$ ${gc.toFixed(2)})`);
  if (eta > 0 && et > 0 && Math.abs(eta - et) > 0.50)
    alertas.push(`Etanol Aditivado (R$ ${eta.toFixed(2)}) distante do Etanol Comum (R$ ${et.toFixed(2)})`);
  if (eta > 0 && et > 0 && eta < et)
    alertas.push(`Etanol Aditivado (R$ ${eta.toFixed(2)}) deveria ser >= Etanol Comum (R$ ${et.toFixed(2)})`);
  if (ds500 > 0 && ds > 0 && Math.abs(ds500 - ds) > 0.30)
    alertas.push(`Diesel S500 (R$ ${ds500.toFixed(2)}) muito diferente do Diesel S10 (R$ ${ds.toFixed(2)})`);
  if (dsa > 0 && ds > 0 && dsa < ds)
    alertas.push(`Diesel S10 Aditivado (R$ ${dsa.toFixed(2)}) deveria ser >= Diesel S10 (R$ ${ds.toFixed(2)})`);
  return alertas;
}

// ── Resumo comparativo (cartão mostrado na lista) ───────────
function renderResumoComparativo() {
  const linhas = COMBUSTIVEIS.map(({ key, label }) => {
    const c = compararProprioVsMercado(key);
    if (!c || !c.nosso) return '';
    if (c.menor === null) return `
      <tr>
        <td>${label.replace('Gasolina ','Gás.')}</td>
        <td style="text-align:right;font-weight:500;color:#185fa5;">R$ ${c.nosso.toFixed(2)}</td>
        <td colspan="2" style="text-align:right;color:#9c9a92;font-size:11px;">sem dados</td>
      </tr>`;
    let pos = '';
    if (c.nosso > c.maior) pos = `<span class="badge badge-red">+R$ ${(c.nosso - c.maior).toFixed(2)} acima do maior</span>`;
    else if (c.nosso < c.menor) pos = `<span class="badge badge-green">−R$ ${(c.menor - c.nosso).toFixed(2)} abaixo do menor</span>`;
    else pos = `<span class="badge badge-amber">dentro da faixa</span>`;
    return `
      <tr>
        <td>${label.replace('Gasolina ','Gás.')}</td>
        <td style="text-align:right;font-weight:500;color:#185fa5;">R$ ${c.nosso.toFixed(2)}</td>
        <td style="text-align:right;font-size:11px;color:#73726c;">${c.menor.toFixed(2)} / ${c.maior.toFixed(2)}</td>
        <td style="text-align:right;">${pos}</td>
      </tr>`;
  }).filter(Boolean).join('');

  if (!linhas) return '';
  return `
    <div class="card">
      <div class="label" style="margin-bottom:8px;">Seu posto vs concorrentes</div>
      <table class="resumo-table" style="font-size:12px;">
        <thead><tr><th>Combustível</th><th style="text-align:right;">Nosso</th><th style="text-align:right;">Menor / Maior</th><th style="text-align:right;">Posição</th></tr></thead>
        <tbody>${linhas}</tbody>
      </table>
    </div>`;
}

        ${f.iaUsada?'<span style="font-size:11px;color:#185fa5;">Preenchido pela IA — confira</span>':''}
      </div>
      <div class="price-grid">${campos}</div>
      <div class="hint">Deixe em branco os combustíveis que ${isProprio?'seu posto':'o posto'} não vende.</div>
      ${alertas.length > 0 ? `
        <div style="margin-top:10px;background:#faeeda;border:0.5px solid #ba7517;border-radius:8px;padding:10px 12px;">
          <div style="font-size:11px;font-weight:500;color:#854f0b;margin-bottom:4px;">⚠️ Verifique os preços:</div>
          ${alertas.map(a=>`<div style="font-size:11px;color:#854f0b;margin-top:2px;">· ${a}</div>`).join('')}
        </div>` : ''}
    </div>

    ${!isProprio ? `
      <div class="card">
        <div class="label" style="margin-bottom:6px;">Observações (opcional)</div>
        <textarea rows="3" placeholder="Ex: Promoção no etanol até sexta..." oninput="setObs(this.value)">${f.obs}</textarea>
      </div>` : ''}

    <button class="btn-primary" id="btn-salvar" onclick="salvar(${isProprio})" ${podeSalvar(f, isProprio) ? '' : 'disabled'}>
      ${isProprio?'Salvar painel do meu posto':'Salvar registro'}
    </button>
    ${!f.imgPreview ? `<div style="font-size:11px;color:#a32d2d;text-align:center;margin-top:4px;">⚠️ Foto do painel é obrigatória</div>` : ''}
    ${!isProprio && !f.nome.trim() ? `<div style="font-size:11px;color:#a32d2d;text-align:center;margin-top:4px;">⚠️ Nome do concorrente é obrigatório</div>` : ''}`;
}

function podeSalvar(f, isProprio) {
  if (!f.imgPreview) return false;
  if (!isProprio && !f.nome.trim()) return false;
  return true;
}

// ── Ações ──────────────────────────────────────────────────
function selecionarPosto(id) { state.posto = POSTOS.find(p=>p.id===id); state.tela='lista'; render(); }
function trocarPosto() { state.tela='selector'; render(); }
function irLista()    { state.tela='lista'; render(); }
function irResumo()   { state.tela='resumo'; render(); }

function startGPS() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    pos => {
      state.form.lat = pos.coords.latitude.toFixed(6);
      state.form.lng = pos.coords.longitude.toFixed(6);
      state.form.locStatus = 'ok';
      const el = document.getElementById('loc-status');
      if (el) el.innerHTML = `<span class="badge badge-green" style="font-size:10px;">GPS ✓</span>`;
    },
    () => {
      state.form.locStatus = 'erro';
      const el = document.getElementById('loc-status');
      if (el) el.innerHTML = `<span class="badge badge-gray" style="font-size:10px;">Sem GPS</span>`;
    },
    { enableHighAccuracy:true, timeout:10000 }
  );
}

function irColeta()  { state.form = emptyForm(false); state.form.locStatus='buscando'; state.tela='coleta';  render(); startGPS(); }
function irProprio() { state.form = emptyForm(true);  state.form.locStatus='buscando'; state.tela='proprio'; render(); startGPS(); }

function finalizarPesquisa() {
  const n = state.registros.length;
  if (n < 7) {
    const ok = confirm(`Você só registrou ${n} concorrente${n===1?'':'s'} (meta é 7).\n\nTem certeza que quer finalizar a pesquisa agora?`);
    if (!ok) return;
  }
  irProprio();
}

function setNome(v)     { state.form.nome=v; atualizarBotao(); }
function setBandeira(v) { state.form.bandeira=v; }
function setPreco(k,v)  {
  state.form[k]=v;
  if (state.form.precosIA && state.form.precosIA[k] !== undefined) {
    if (v !== state.form.precosIA[k]) {
      state.form.camposEditados = state.form.camposEditados || {};
      state.form.camposEditados[k] = true;
    } else if (state.form.camposEditados) delete state.form.camposEditados[k];
  }
  atualizarBotao();
}
function setObs(v) { state.form.obs=v; }
function setDrop(v){ state.form.dropOpen=v; }

function atualizarBotao() {
  const btn = document.getElementById('btn-salvar');
  if (!btn) return;
  btn.disabled = !podeSalvar(state.form, state.form.isProprio);
}

function escolherSugestao(nome) {
  const historico = getHistorico(state.posto.id);
  const item = historico.find(h => h.nome === nome);
  state.form.nome = nome;
  if (item && item.bandeira) state.form.bandeira = item.bandeira;
  else if (BANDEIRAS.includes(nome)) state.form.bandeira = nome;
  state.form.dropOpen = false;
  render();
}

function trocarFoto() {
  _fotoFile = null;
  state.form.imgPreview = null; state.form.imgFile = null;
  state.form.iaUsada = false; state.form.erroIA = false;
  state.form.gc=state.form.ga=state.form.et=state.form.eta=state.form.ds=state.form.ds500=state.form.dsa='';
  state.form.precosIA = null; state.form.camposEditados = {};
  render();
}

async function handleFoto(input) {
  const file = input.files[0];
  if (!file) return;
  _fotoFile = file;
  state.form.imgPreview = URL.createObjectURL(file);
  state.form.imgFile = file;
  state.form.loading = true;
  state.form.iaUsada = false;
  state.form.erroIA = false;
  render();

  try {
    const exif = await exifr.parse(file, { gps:true });
    if (exif && exif.latitude && exif.longitude) {
      state.form.lat = exif.latitude.toFixed(6);
      state.form.lng = exif.longitude.toFixed(6);
      state.form.locStatus = 'ok';
    }
  } catch(e) {}

  try {
    const precos = await lerFotoComIA(file);
    state.form.gc    = precos.gc    || '';
    state.form.ga    = precos.ga    || '';
    state.form.et    = precos.et    || '';
    state.form.eta   = precos.eta   || '';
    state.form.ds    = precos.ds    || '';
    state.form.ds500 = precos.ds500 || '';
    state.form.dsa   = precos.dsa   || '';
    if (!state.form.isProprio && precos.bandeira) {
      const enc = BANDEIRAS.find(b => b.toLowerCase() === (precos.bandeira||'').toLowerCase());
      if (enc) state.form.bandeira = enc;
    }
    state.form.precosIA = {
      gc:precos.gc||'', ga:precos.ga||'', et:precos.et||'', eta:precos.eta||'',
      ds:precos.ds||'', ds500:precos.ds500||'', dsa:precos.dsa||''
    };
    state.form.camposEditados = {};
    state.form.iaUsada = !!(precos.gc||precos.ga||precos.et||precos.eta||precos.ds||precos.ds500||precos.dsa);
    state.form.erroIA = !state.form.iaUsada;
  } catch(e) {
    state.form.erroIA = true;
  }
  state.form.loading = false;
  render();
}

async function salvar(isProprio) {
  const f = state.form;
  const btn = document.getElementById('btn-salvar');
  if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }

  let fotoUrl = null;
  if (_fotoFile) fotoUrl = await uploadFoto(_fotoFile, state.posto.id);

  const reg = {
    nome: isProprio ? state.posto.nome : f.nome,
    bandeira: isProprio ? state.posto.bandeira : f.bandeira,
    gc:f.gc, ga:f.ga, et:f.et, eta:f.eta, ds:f.ds, ds500:f.ds500, dsa:f.dsa,
    obs: f.obs,
    imgPreview: fotoUrl || f.imgPreview,
    iaUsada: f.iaUsada, hora: hora(),
    lat: f.lat, lng: f.lng, fotoUrl,
    camposEditados: f.camposEditados,
  };

  if (isProprio) {
    state.proprio = reg;
  } else {
    state.registros.push(reg);
    salvarHistorico(state.posto.id, f.nome, f.bandeira);
  }
  await salvarSupabase(reg, isProprio);
  _fotoFile = null;
  irLista();
}

function init() {
  const p = getPostoFromURL();
  if (p) { state.posto = p; state.tela = 'lista'; }
  else state.tela = 'selector';
  render();
}

init();
</script>
</body>
</html>
